<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Native widgets — scrollbars, <select> menus, form controls — are drawn
         by the OS and cannot read tokens.css. Declaring both is what lets the
         `color-scheme` property in each palette block pick one; without it a
         dark Lamplight window keeps a light scrollbar down its side. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vapor Music</title>
    <!--
      Fonts are bundled rather than fetched: the app must work with no network,
      which is the entire premise, and the CSP blocks remote origins anyway.
    -->
    <!--
      Icons are generated, not drawn: `npm run mark` renders them from the same
      element the app uses, pinned to the pose in src/lib/mark.json.
    -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <!-- The mark is a dependency-free custom element; it registers itself. -->
    <script src="/vapor-ribbon.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
