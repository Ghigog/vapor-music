name: App

# Separate from ci.yml, and path-filtered, on purpose.
#
# Building Tauri's dependency tree takes minutes. Putting these jobs in the main
# workflow would tax every commit — including ones that only touch the Godot
# tree or the docs — so the shell gets its own workflow that only runs when the
# shell or the core it depends on actually changes.
on:
  push:
    branches: [main]
    paths:
      - "vapor-app/**"
      - "vapor-core/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "vapor-app/**"
      - "vapor-core/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The frontend is cheap to check, so it runs on its own and reports fast
  # rather than waiting behind a Rust build.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vapor-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      # `npm ci` rather than `install`: the lockfile is the point of running
      # this in CI at all.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The layer that did not exist until the suite was built. Five defects
      # reached a person in one sitting and every one lived in a screen or in
      # the seam between a screen and the shell — see docs/TESTING.md.
      - name: Component tests
        run: npm test

      # `npm run build` rather than `npx vite build`: the script also runs
      # `scripts/verify-dist.mjs`, which checks that index.html points at files
      # that exist. A torn bundle starts, serves the page, loads no JavaScript
      # and shows an empty window — no React, so not even the error boundary
      # reports it. Nothing else in this workflow can see that.
      - name: Build
        run: npm run build

  # Whole journeys through the real UI, plus a seeded monkey.
  #
  # Separate from the component job because it needs a browser download and a
  # dev server, and because a failure here means something different: the
  # component tests say a screen behaves, these say the app does.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vapor-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      - run: npm ci

      # Chromium only: the app ships inside a WebView, so a cross-browser
      # matrix would be testing engines it never runs in.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Journeys and monkey
        run: npm run e2e

      # Only written on failure, and the reason a monkey failure is actionable
      # rather than a rumour: the trace shows every action it took.
      - name: Upload the trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            vapor-app/playwright-report/
            vapor-app/test-results/
          retention-days: 7

  # Check, test and clippy — but not a full bundle. Bundling produces
  # installers nobody consumes on every push, and takes several times longer.
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows included: the shell is the half of the app with platform code
        # in it — keyring, media keys, the audio device, the webview — and it
        # was the only Rust that was not built on all three. `vapor-core`
        # already runs the full matrix in ci.yml.
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        # bash on every runner, Windows included. The steps below use `mkdir -p`
        # and `touch`, which PowerShell does not have, and a job that only runs
        # on two platforms is exactly how the third stops being built.
        shell: bash
        working-directory: vapor-app/src-tauri

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend is WebKitGTK; cpal needs ALSA headers; keyring
      # and souvlaki (MPRIS, MIG-023) both need D-Bus. None is present on a
      # bare runner.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vapor-app/src-tauri

      # tauri.conf.json points frontendDist at ../dist, which does not exist
      # until the frontend builds. An empty directory satisfies the config
      # without spending a full frontend build in this job — the frontend job
      # above is what actually verifies it.
      - name: Stub the frontend dist
        run: mkdir -p ../dist && touch ../dist/index.html

      # The core has been format-gated since phase 0; the shell was not, so it
      # had drifted. Gating it too means `cargo fmt` never again produces a
      # diff in files a change did not touch.
      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      # The Android credential store, type-checked on a machine with no NDK.
      #
      # `src/secrets/android.rs` is fifty-odd transcribed JNI method signatures,
      # and a wrong one is a runtime abort on a phone rather than a compile
      # error anywhere. This compiles the module on all three desktop runners so
      # the signatures are checked on every push, not only when the Android job
      # below has an NDK to work with.
      - name: Check the Android credential store
        run: cargo check --features android-check

      # The shell has real logic worth gating on: the cache, the store, and the
      # audio path's proof that it neither allocates nor frees on the audio
      # thread (TD-03). None of it needs a window or a device, so it runs on a
      # bare runner like any other test.
      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets

      # Debug and release are different compilations, and `tauri build` — the
      # thing that produces an app anyone can open — only ever runs release.
      # Everything above this line passed while `npm run app:build` was the
      # only way to find out whether the shipped artefact compiles at all.
      #
      # The build, not the bundle: bundling adds installer machinery and code
      # signing on top, which is a different failure surface and a much slower
      # job. This catches the compile.
      - name: Release build
        run: cargo build --release

  # Android, compiled on a runner rather than on a laptop.
  #
  # The shell is where every platform assumption lives, and Android breaks more
  # of them than Windows did: no OS credential store, a different audio backend,
  # no media-key daemon. None of that is visible from a macOS build, and the one
  # machine that could have found it has no NDK installed.
  #
  # GitHub's Ubuntu runners ship one. `ANDROID_NDK_LATEST_HOME` is set on the
  # image, so this needs no download and no `sdkmanager`.
  #
  # A compile, not a bundle. `tauri android build` needs a generated Gradle
  # project (`gen/android`), which is not in the tree; `cargo build` for the
  # target is what proves the Rust half — every `cfg` gate, every dependency
  # that has no Android backend — and that is the half that was broken.
  android:
    name: android (compile)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: vapor-app/src-tauri

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vapor-app/src-tauri
          key: android

      - name: Stub the frontend dist
        run: mkdir -p ../dist && touch ../dist/index.html

      # `ring` and the other C dependencies are built by the `cc` crate, which
      # looks for a target-prefixed compiler. The NDK ships one per API level;
      # 24 is the floor Tauri's Android template targets.
      - name: Point the linker and cc at the NDK
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$TOOLCHAIN" || { echo "no NDK toolchain at $TOOLCHAIN"; exit 1; }
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          {
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"

      - name: Check
        run: cargo check --target aarch64-linux-android

      - name: Clippy
        run: cargo clippy --target aarch64-linux-android
