[workspace]
resolver = "2"
members = [
    "crates/vapor-dsp",
    "crates/vapor-engine",
    "crates/vapor-library",
    "crates/vapor-dj",
]

[workspace.package]
edition = "2021"
# Proprietary; see LICENSE and docs/LICENSING.md. A `LicenseRef-`
# identifier is the SPDX way to say "not one of the standard ones".
license = "LicenseRef-Proprietary"

# Analysis runs over a whole library at import time; debug-speed DSP makes the
# validation harness unusable, so optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3
