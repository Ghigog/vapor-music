[package]
name = "vapor-app"
version = "2.0.0"
edition = "2021"
# Proprietary; see LICENSE and docs/LICENSING.md. A `LicenseRef-`
# identifier is the SPDX way to say "not one of the standard ones".
license = "LicenseRef-Proprietary"

[lib]
# Tauri 2 builds the app as a library so the mobile targets can link it.
name = "vapor_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebDAV transport. rustls rather than the system TLS stack so the same code
# builds on every desktop target without a platform TLS dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
# Row thumbnails only (PERF-004). Default features pull in every decoder there
# is; covers embedded in music files are JPEG or PNG, and nothing else here
# touches an image.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Local wall-clock for the audio-fault log. Already in the tree via tauri, so
# this costs nothing to compile; `clock` is the feature that knows the local
# offset, which is the whole reason for it — a UTC stamp is five hours off the
# clock of the person reading it.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
base64 = "0.22"
# keyring's platform backends are opt-in features, and with none of them
# enabled version 3 silently falls back to a *mock* store: `set_password`
# returns `Ok(())` and keeps the secret inside that one `Entry` object. The app
# saves in one command and reads in the next — a fresh `Entry` each time — so
# every read returned `NoEntry` while every save reported success. Nothing had
# ever reached the keychain. See the platform blocks below; the bare
# `keyring = "3"` that used to be here is the bug.
#
# Declared per target rather than as one feature list so macOS does not pull in
# the Linux secret-service stack and vice versa.

# Audio output (TD-03). The engine itself stays platform-free — a device only
# exists here, in the shell, and behind an AudioWorklet in the browser build.
# MIG-011: cpal on Android/iOS is the least battle-tested part of this stack.
cpal = "0.15"

# The whole point of the migration: the shell is a thin adapter over these.
vapor-dsp = { path = "../../vapor-core/crates/vapor-dsp" }
vapor-engine = { path = "../../vapor-core/crates/vapor-engine" }
vapor-library = { path = "../../vapor-core/crates/vapor-library" }
# The DJ's decisions (AUD-14). Depends on both of the above, which is why it is
# a crate of its own rather than a module in either.
vapor-dj = { path = "../../vapor-core/crates/vapor-dj" }
lofty = "0.25.1"
# System media controls: hardware keys, macOS Control Center, Windows SMTC,
# Linux MPRIS (MIG-023). One crate for all three desktop targets, which is why
# MIG-022 decided not to port the Godot build's 191 lines of C++/WinRT — three
# platform ports maintained separately is what this replaces.
souvlaki = "0.8.3"
# `no-serde-warnings`: the boundary structs carry `#[serde(alias = "...")]`
# so files written before the camelCase rename still load. Aliases are a
# deserialisation concern with no bearing on the generated type, and ts-rs
# says so once per alias on every build. The warning is right and the noise
# is not useful.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
hmac = "0.13"
sha2 = "0.10"
hkdf = "0.12"
getrandom = "0.3"
x25519-dalek = { version = "2", features = ["static_secrets"] }

# Android has no OS credential store, so `keyring` has nothing to wrap there.
# `src/secrets/android.rs` reaches the Android Keystore over JNI instead;
# `ndk-context` is how it finds the JVM and the app Context that the Android
# entry point published. Both are already in the tree as `cpal` dependencies
# for this target — declared here too because this crate uses them directly,
# and an inherited dependency is one `cargo update` away from disappearing.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# The same two, optional, for every other target.
#
# `android-check` is not a runtime feature — nothing on a desktop calls into
# `secrets::android`. It exists so `cargo check --features android-check`
# type-checks about fifty JNI method signatures on a machine with no NDK, which
# is where they were written and where a typo in one is otherwise invisible
# until it aborts a phone.
[target.'cfg(not(target_os = "android"))'.dependencies]
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }

[features]
android-check = ["dep:jni", "dep:ndk-context"]

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

# Linux is not a shipping target — it exists so CI has a third platform to
# compile and test on. `sync-secret-service` is still the right store rather
# than `linux-native`, whose kernel keyring does not survive a reboot: a
# credential store that quietly forgets is the same class of bug as the mock
# above. It needs `libdbus-1-dev`, which the workflow installs.
#
# `crypto-rust` encrypts the D-Bus session without an OpenSSL build
# dependency, matching the rustls choice made for reqwest above.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# The self-updater, desktop only.
#
# Tauri's updater replaces the application bundle on disk, which is a thing
# only a desktop OS lets a program do; Android and iOS update through their
# stores. Declared per target for that reason, not as a feature toggle.
#
# It has to ship in v1. The public key and the endpoint below are compiled
# into the binary, so a build handed to someone without them can never be
# updated — every later version would be a manual re-download.
[dependencies.tauri-plugin-dialog]
# The native folder picker, for choosing where music lives on this device.
#
# A dependency rather than a text field, because the alternative is asking a
# person to type an absolute path — which they cannot see, cannot browse, and
# will get wrong on the first try. It is also the only way to get a usable
# answer on Android, where there is no path a person could type.
#
# Unlike the updater below this is not desktop-only: mobile needs it more.
version = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# Optimise dependencies even in a debug build.
#
# `image` decodes, resizes and re-encodes an album cover, and unoptimised that
# is ~330 ms per cover — measured, on the 563-track library. A screenful of
# rows would then spend several seconds generating thumbnails the first time,
# which is worse than the freeze the thumbnails exist to remove (PERF-004).
# `tauri dev` builds debug, so that cost is what a person developing this
# actually feels.
#
# Dependencies only. This crate keeps its own debug profile, so an edit here
# still rebuilds in seconds; the cost is a one-off longer first build.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
