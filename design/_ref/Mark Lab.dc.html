<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@200;300;400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f4f4f7;font-family:'Inter',sans-serif}a{color:#007AFF}a:hover{color:#3396ff}</style>
</helmet>

<section style="padding:48px; display:flex; flex-direction:column; gap:36px; background:linear-gradient(180deg,#eef3fb 0%,#f6f5f2 60%); min-height:100vh; box-sizing:border-box">
  <div style="font-family:'Outfit',sans-serif; font-weight:300; font-size:36px; color:#1c1c1e">Generative mark — states</div>

  <div style="display:flex; gap:28px; flex-wrap:wrap; align-items:flex-start">
    <div style="display:flex; flex-direction:column; gap:10px; align-items:center; padding:24px; border-radius:24px; background:rgba(255,255,255,0.72); border:1px solid rgba(255,255,255,0.9); box-shadow:0 10px 30px -10px rgba(40,60,110,0.2)">
      <x-import component-from-global-scope="vapor-mark" from="./vapor-mark.js" size="200" theme="light" state="idle" hint-size="200px,200px"></x-import>
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#6b6b70">idle · light</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; align-items:center; padding:24px; border-radius:24px; background:rgba(255,255,255,0.72); border:1px solid rgba(255,255,255,0.9); box-shadow:0 10px 30px -10px rgba(40,60,110,0.2)">
      <x-import component-from-global-scope="vapor-mark" size="200" theme="light" state="playing" energy="0.8" hint-size="200px,200px"></x-import>
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#6b6b70">playing · e=0.8</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; align-items:center; padding:24px; border-radius:24px; background:rgba(255,255,255,0.72); border:1px solid rgba(255,255,255,0.9); box-shadow:0 10px 30px -10px rgba(40,60,110,0.2)">
      <x-import component-from-global-scope="vapor-mark" size="200" theme="light" state="blending" hint-size="200px,200px"></x-import>
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#6b6b70">blending</span>
    </div>
    <div style="display:flex; flex-direction:column; gap:10px; align-items:center; padding:24px; border-radius:24px; background:#141418; border:1px solid rgba(255,255,255,0.1)">
      <x-import component-from-global-scope="vapor-mark" size="200" theme="dark" state="thinking" hint-size="200px,200px"></x-import>
      <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:rgba(255,255,255,0.5)">thinking · dark</span>
    </div>
  </div>

  <div style="display:flex; gap:20px; align-items:center; padding:20px 24px; border-radius:20px; background:rgba(255,255,255,0.7); border:1px solid rgba(255,255,255,0.9)">
    <x-import component-from-global-scope="vapor-mark" size="28" theme="light" state="playing" energy="0.6" hint-size="28px,28px"></x-import>
    <x-import component-from-global-scope="vapor-mark" size="40" theme="light" state="idle" hint-size="40px,40px"></x-import>
    <x-import component-from-global-scope="vapor-mark" size="56" theme="light" state="thinking" hint-size="56px,56px"></x-import>
    <x-import component-from-global-scope="vapor-mark" size="80" theme="light" state="blending" hint-size="80px,80px"></x-import>
    <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#6b6b70">28 · 40 · 56 · 80 px</span>
  </div>

  <div style="display:flex; gap:24px; align-items:center">
    <img src="assets/vapor-logo.png" alt="reference" style="width:200px; height:200px; display:block">
    <span style="font-family:'JetBrains Mono',monospace; font-size:11px; color:#6b6b70">painted reference</span>
  </div>
</section>

</x-dc>
</body>
</html>
