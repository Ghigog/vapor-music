[package]
name = "vapor-dj"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The catalogue side of a decision: what a track is, and what one transition
# between two of them costs.
vapor-library = { path = "../vapor-library" }
# The mixing side: which of the six transition types to ask the mixer for.
#
# This is why the planner is its own crate rather than a module in either of
# them. `vapor-library` cannot depend on `vapor-engine` — the engine pulls in
# cpal and signalsmith on every non-wasm target, and the library has no
# business carrying an audio device. `vapor-engine` could depend on
# `vapor-library`, but then the audio engine would carry regex, ts-rs and tag
# parsing to answer a question it never asks. The planner is the one thing that
# genuinely needs both, so it is the one thing that depends on both.
vapor-engine = { path = "../vapor-engine" }
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }

[dev-dependencies]
proptest = "1"
