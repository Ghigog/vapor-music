name: App

# Separate from ci.yml, and path-filtered, on purpose.
#
# Building Tauri's dependency tree takes minutes. Putting these jobs in the main
# workflow would tax every commit — including ones that only touch the Godot
# tree or the docs — so the shell gets its own workflow that only runs when the
# shell or the core it depends on actually changes.
on:
  push:
    branches: [main]
    paths: &paths
      - "vapor-app/**"
      - "vapor-core/**"
      - ".github/workflows/app.yml"
      # `tests/docs_state_claims.rs` reads the docs tree and the README, so an
      # edit to either can fail this workflow. Without these two lines it fails
      # on the *next* commit that touches the app, which is a different commit
      # from the one that broke it — exactly how a broken doc link sat in main
      # until someone else's push found it.
      - "docs/**"
      - "README.md"
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The frontend is cheap to check, so it runs on its own and reports fast
  # rather than waiting behind a Rust build.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vapor-app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      # `npm ci` rather than `install`: the lockfile is the point of running
      # this in CI at all.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The layer that did not exist until the suite was built. Five defects
      # reached a person in one sitting and every one lived in a screen or in
      # the seam between a screen and the shell — see docs/TESTING.md.
      - name: Component tests
        run: npm test

      # An npm script rather than `npx vite build`: the script also runs
      # `scripts/verify-dist.mjs`, which checks that index.html points at files
      # that exist. A torn bundle starts, serves the page, loads no JavaScript
      # and shows an empty window — no React, so not even the error boundary
      # reports it. Nothing else in this workflow can see that.
      #
      # `build:web` and not `build`, because `build` also runs the ts-rs drift
      # check, which compiles the whole Rust shell and so needs the ALSA,
      # WebKitGTK and D-Bus headers this job deliberately does not install.
      # b3714f4 put that check into `npm run build` and every run of this job
      # since has died on `alsa-sys` — in the one job whose point is to report
      # fast without waiting for Rust. The check moved to the shell job.
      - name: Build
        run: npm run build:web

  # Whole journeys through the real UI, plus a seeded monkey.
  #
  # Separate from the component job because it needs a browser download and a
  # dev server, and because a failure here means something different: the
  # component tests say a screen behaves, these say the app does.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vapor-app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      - run: npm ci

      # Chromium only: the app ships inside a WebView, so a cross-browser
      # matrix would be testing engines it never runs in.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Journeys and monkey
        run: npm run e2e

      # Only written on failure, and the reason a monkey failure is actionable
      # rather than a rumour: the trace shows every action it took.
      - name: Upload the trace
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            vapor-app/playwright-report/
            vapor-app/test-results/
          retention-days: 7

  # Check, test and clippy — but not a full bundle. Bundling produces
  # installers nobody consumes on every push, and takes several times longer.
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows included: the shell is the half of the app with platform code
        # in it — keyring, media keys, the audio device, the webview — and it
        # was the only Rust that was not built on all three. `vapor-core`
        # already runs the full matrix in ci.yml.
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        # bash on every runner, Windows included. The steps below use `mkdir -p`
        # and `touch`, which PowerShell does not have, and a job that only runs
        # on two platforms is exactly how the third stops being built.
        shell: bash
        working-directory: vapor-app/src-tauri

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Tauri's Linux backend is WebKitGTK; cpal needs ALSA headers; keyring
      # and souvlaki (MPRIS, MIG-023) both need D-Bus. None is present on a
      # bare runner.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: vapor-app/src-tauri

      # tauri.conf.json points frontendDist at ../dist, which does not exist
      # until the frontend builds. An empty directory satisfies the config
      # without spending a full frontend build in this job — the frontend job
      # above is what actually verifies it.
      - name: Stub the frontend dist
        run: mkdir -p ../dist && touch ../dist/index.html

      # The core has been format-gated since phase 0; the shell was not, so it
      # had drifted. Gating it too means `cargo fmt` never again produces a
      # diff in files a change did not touch.
      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      # The Android credential store, type-checked on a machine with no NDK.
      #
      # `src/secrets/android.rs` is fifty-odd transcribed JNI method signatures,
      # and a wrong one is a runtime abort on a phone rather than a compile
      # error anywhere. This compiles the module on all three desktop runners so
      # the signatures are checked on every push, not only when the Android job
      # below has an NDK to work with.
      - name: Check the Android credential store
        run: cargo check --features android-check

      # The shell has real logic worth gating on: the cache, the store, and the
      # audio path's proof that it neither allocates nor frees on the audio
      # thread (TD-03). None of it needs a window or a device, so it runs on a
      # bare runner like any other test.
      - name: Test
        run: cargo test

      # Windows exits 0xc0000139 (STATUS_ENTRYPOINT_NOT_FOUND) before any test
      # runs: the loader found a DLL the binary imports from, but not a symbol
      # it wanted out of it. The harness prints nothing, because it never
      # started.
      #
      # Not caused by anything in this repository, as far as the evidence goes.
      # The last run where this step reached the test binary was 4bad6f4c on
      # 2026-08-20, on runner image win25-vs2026/20260810.198; every run between
      # then and 50004e6 died earlier, at `cargo fmt` or at clippy, so the first
      # execution since the image moved to 20260818.207 is also the first
      # failure. No `windows-*` crate changed version in that range.
      #
      # The first version of this step reported nothing missing because it had
      # compared nothing: its import regex wanted eight hex digits, a word and
      # a name, and `dumpbin /imports` prints two columns — a variable-width
      # hint and the name. Every DLL came out with an empty wanted-list, and
      # the "nothing listed above" line then read as a clean bill of health.
      # Run 32613443721 printed it having parsed 0 of the binary's imports.
      #
      # So this version prints how many names it parsed per module, walks the
      # whole load graph rather than the first level, and resolves each DLL the
      # way the loader would — beside the binary first, then System32, then
      # PATH — because the usual cause of this error is a shadowing copy.
      - name: Which DLL is missing an export
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        working-directory: vapor-app/src-tauri
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "image: $env:ImageOS $env:ImageVersion"

          $exe = Get-ChildItem target/debug/deps -Filter 'vapor_app_lib-*.exe' |
                 Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { Write-Host 'no test binary found'; exit 0 }
          Write-Host "binary: $($exe.FullName)"

          # A DLL in the binary's own directory beats System32 for every name
          # the loader resolves after it, so this is the first thing to rule
          # out. cargo puts build-script output next to the test binary.
          Write-Host "--- DLLs beside the binary ---"
          $beside = Get-ChildItem $exe.DirectoryName -Filter '*.dll' -ErrorAction SilentlyContinue
          if (-not $beside) { Write-Host '  (none)' }
          $beside | ForEach-Object { Write-Host "  $($_.Name)  ($($_.VersionInfo.FileVersion))" }

          # Which CRT copies exist and where. Kept from the previous version:
          # it is cheap, and it is how we know System32 holds the newest.
          foreach ($dll in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll') {
            Write-Host "--- $dll ---"
            $found = (where.exe $dll) 2>$null
            if (-not $found) { Write-Host '  not on PATH'; continue }
            foreach ($path in $found) {
              $v = (Get-Item $path).VersionInfo.FileVersion
              Write-Host "  $path  ($v)"
            }
          }

          # Host x64, explicitly. An earlier version sorted by name descending
          # and picked Hostx86\x86, whose dumpbin needs its own x86 runtime to
          # start — it produced no parseable output at all.
          $dumpbin = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' `
                       -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
                     Where-Object { $_.FullName -like '*Hostx64\x64*' } |
                     Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { Write-Host 'no x64 dumpbin on this image'; exit 0 }
          Write-Host "dumpbin: $($dumpbin.FullName)"

          # `/imports` prints "    <name>.dll" for each module, then one line
          # per imported symbol as "<hex hint> <name>", or "Ordinal <n>" when
          # the import is by ordinal. The trailing Summary section has lines
          # that look like symbols, hence the break.
          #
          # The delay-load section is skipped, and not only because its header
          # fields parse as symbols — the run that found this reported
          # "Characteristics" missing from thirty System32 DLLs, which is that
          # header. It cannot hold the answer either way: the loader does not
          # bind a delay-load import at load time, so a missing one raises its
          # error on first call, not as STATUS_ENTRYPOINT_NOT_FOUND before main.
          function Get-Imports($file) {
            $map = @{}
            $dll = $null
            foreach ($line in (& $dumpbin.FullName /imports $file 2>$null)) {
              if ($line -match '^\s+Summary\s*$') { break }
              if ($line -match 'delay load imports') { break }
              if ($line -match '^\s{4}(\S+\.dll)\s*$') {
                $dll = $Matches[1].ToLower()
                if (-not $map.ContainsKey($dll)) { $map[$dll] = New-Object System.Collections.ArrayList }
                continue
              }
              if (-not $dll) { continue }
              if ($line -match '^\s+Ordinal\s+(\d+)\s*$') { [void]$map[$dll].Add('#' + $Matches[1]); continue }
              if ($line -match '^\s+[0-9A-Fa-f]+\s+(\S+)\s*$') { [void]$map[$dll].Add($Matches[1]) }
            }
            return $map
          }

          # `/exports` prints "ordinal hint RVA name". Forwarded exports —
          # every name in the api-ms-win-crt-* stubs is one — leave the RVA
          # column blank, which is why the RVA group is optional. Requiring it
          # would report the entire C runtime as missing.
          function Get-Exports($file) {
            $set = New-Object System.Collections.Generic.HashSet[string]
            $inTable = $false
            foreach ($line in (& $dumpbin.FullName /exports $file 2>$null)) {
              if (-not $inTable) {
                if ($line -match '^\s*ordinal\s+hint\s+RVA\s+name') { $inTable = $true }
                continue
              }
              if ($line -match '^\s+Summary\s*$') { break }
              if ($line -match '^\s+(\d+)\s+[0-9A-Fa-f]+\s+(?:[0-9A-Fa-f]{8}\s+)?(\S+)') {
                [void]$set.Add($Matches[2]); [void]$set.Add('#' + $Matches[1])
              } elseif ($line -match '^\s+(\d+)\s+[0-9A-Fa-f]+') {
                [void]$set.Add('#' + $Matches[1])
              }
            }
            return $set
          }

          $sys = Join-Path $env:SystemRoot 'System32'
          function Resolve-Dll($name, $ownerDir) {
            foreach ($d in @($ownerDir, $sys, $env:SystemRoot)) {
              $p = Join-Path $d $name
              if (Test-Path $p) { return (Get-Item $p).FullName }
            }
            foreach ($d in ($env:PATH -split ';')) {
              if (-not $d) { continue }
              $p = Join-Path $d $name
              if (Test-Path $p) { return (Get-Item $p).FullName }
            }
            return $null
          }

          $queue = New-Object System.Collections.Queue
          $queue.Enqueue($exe.FullName)
          $seen = New-Object System.Collections.Generic.HashSet[string]
          [void]$seen.Add($exe.FullName.ToLower())
          $exports = @{}
          $problems = New-Object System.Collections.ArrayList
          $unresolved = New-Object System.Collections.ArrayList
          $walked = 0

          Write-Host "--- walking the load graph ---"
          while ($queue.Count -gt 0 -and $walked -lt 250) {
            $mod = $queue.Dequeue()
            $walked++
            $dir = Split-Path $mod -Parent
            $leaf = Split-Path $mod -Leaf
            $imports = Get-Imports $mod
            $names = 0
            foreach ($v in $imports.Values) { $names += $v.Count }
            Write-Host ("  {0}: {1} DLLs, {2} names" -f $leaf, $imports.Keys.Count, $names)
            foreach ($d in $imports.Keys) {
              # API-set names are resolved by the loader through the apiset
              # schema and never by searching directories, so whatever a path
              # search turns up for one is the wrong file. It found a stray
              # api-ms-win-eventing-controller-l1-1-0.dll in the Windows
              # Performance Toolkit and reported five exports missing from it,
              # none of which meant anything.
              if ($d -like 'api-ms-*' -or $d -like 'ext-ms-*') { continue }
              $path = Resolve-Dll $d $dir
              if (-not $path) { [void]$unresolved.Add("$d (wanted by $leaf)"); continue }
              $key = $path.ToLower()
              if (-not $exports.ContainsKey($key)) { $exports[$key] = Get-Exports $path }
              $have = $exports[$key]
              $missing = @($imports[$d] | Where-Object { -not $have.Contains($_) })
              if ($missing.Count -gt 0) {
                [void]$problems.Add("MISSING from ${path}: " + ($missing -join ', ') + "  (wanted by $leaf)")
              }
              if ($seen.Add($key)) { $queue.Enqueue($path) }
            }
          }

          Write-Host ""
          Write-Host "--- result ---"
          Write-Host "modules walked: $walked"
          if ($unresolved.Count -gt 0) {
            Write-Host "not found on disk (api-ms-* names resolve through the apiset schema, so these are usually fine):"
            $unresolved | Sort-Object -Unique | ForEach-Object { Write-Host "    $_" }
          }
          if ($problems.Count -eq 0) {
            Write-Host "no missing export anywhere in the walked graph"
          } else {
            $problems | ForEach-Object { Write-Host $_ }
          }
          exit 0

      - name: Clippy
        run: cargo clippy --all-targets

      # The generated TypeScript under vapor-app/src/lib/generated/ is committed
      # so the frontend builds without a Rust toolchain, which is exactly how it
      # can go stale. `types:check` regenerates it and diffs, so it needs cargo
      # and the headers installed above — this is the only job that has both.
      #
      # Linux only: it compares generated text, so running it on three platforms
      # would prove the same thing three times.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: runner.os == 'Linux'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      - name: Frontend types still match the Rust
        if: runner.os == 'Linux'
        working-directory: vapor-app
        run: |
          npm ci
          npm run types:check

      # Debug and release are different compilations, and `tauri build` — the
      # thing that produces an app anyone can open — only ever runs release.
      # Everything above this line passed while `npm run app:build` was the
      # only way to find out whether the shipped artefact compiles at all.
      #
      # The build, not the bundle: bundling adds installer machinery and code
      # signing on top, which is a different failure surface and a much slower
      # job. This catches the compile.
      - name: Release build
        run: cargo build --release

  # Android, compiled on a runner rather than on a laptop.
  #
  # The shell is where every platform assumption lives, and Android breaks more
  # of them than Windows did: no OS credential store, a different audio backend,
  # no media-key daemon. None of that is visible from a macOS build, and the one
  # machine that could have found it has no NDK installed.
  #
  # GitHub's Ubuntu runners ship one. `ANDROID_NDK_LATEST_HOME` is set on the
  # image, so this needs no download and no `sdkmanager`.
  #
  # A compile, not a bundle. `tauri android build` needs a generated Gradle
  # project (`gen/android`), which is not in the tree; `cargo build` for the
  # target is what proves the Rust half — every `cfg` gate, every dependency
  # that has no Android backend — and that is the half that was broken.
  android:
    name: android (compile)
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: vapor-app/src-tauri

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: vapor-app/src-tauri
          key: android

      - name: Stub the frontend dist
        run: mkdir -p ../dist && touch ../dist/index.html

      # `ring` and the other C dependencies are built by the `cc` crate, which
      # looks for a target-prefixed compiler. The NDK ships one per API level;
      # 24 is the floor Tauri's Android template targets.
      - name: Point the linker and cc at the NDK
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$TOOLCHAIN" || { echo "no NDK toolchain at $TOOLCHAIN"; exit 1; }
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          {
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"

      - name: Check
        run: cargo check --target aarch64-linux-android

      - name: Clippy
        run: cargo clippy --target aarch64-linux-android

  # An installer you can actually run, on demand.
  #
  # Separate from `shell` because that job dies at `cargo test` on Windows —
  # STATUS_ENTRYPOINT_NOT_FOUND at DLL load, tracked as AUD-19 — and takes
  # `Release build` down with it, so nothing has ever proved Windows *bundles*.
  # `cargo check` passes there, so the compiler is fine; it is running a test
  # binary that fails. This job answers the other question.
  #
  # Not on push. Bundling is slow and produces installers nobody consumes on a
  # normal commit, which is the same reason `shell` stops at a release build.
  # Run it from the Actions tab when a build is wanted.
  installers:
    name: installers (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: vapor-app/src-tauri
          key: installers-${{ matrix.os }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev

      - run: npm ci
        working-directory: vapor-app

      # `bundle.createUpdaterArtifacts` is on, so `tauri build` signs the
      # updater tarball and fails at the very last step without a key — after
      # producing every installer. The real key is deliberately not in CI (see
      # AUD-21: it is not managed at all until distribution is real), so a
      # throwaway one is generated here.
      #
      # The `.sig` this produces is worthless and is not uploaded. It exists so
      # the build reaches exit 0 rather than reporting failure for a step that
      # has nothing to do with whether the app compiled.
      #
      # `$RUNNER_TEMP`, not `/tmp`. The CLI reads this variable as a path when
      # the path exists and as the key itself when it does not, and `/tmp` on
      # Windows is a Git-bash fiction: bash created the file under
      # AppData\Local\Temp, the CLI looked for `C:\tmp`, found nothing, and
      # base64-decoded the string `/tmp/throwaway.key` instead. It failed on
      # "Invalid symbol 46, offset 14" — symbol 46 is `.`, offset 14 is `.key`.
      #
      # Still the file and not its contents: a private key in an environment
      # variable is a bad habit to write into a workflow, throwaway or not.
      - name: A throwaway updater key, so bundling completes
        shell: bash
        working-directory: vapor-app
        run: |
          npx tauri signer generate -w "$RUNNER_TEMP/throwaway.key" -f --password "" > /dev/null 2>&1
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/throwaway.key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Build
        working-directory: vapor-app
        run: npx tauri build

      # Everything a person downloads, and nothing that pretends to be signed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vapor-music-${{ matrix.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            vapor-app/src-tauri/target/release/bundle/nsis/*.exe
            vapor-app/src-tauri/target/release/bundle/msi/*.msi
            vapor-app/src-tauri/target/release/bundle/deb/*.deb
            vapor-app/src-tauri/target/release/bundle/appimage/*.AppImage
