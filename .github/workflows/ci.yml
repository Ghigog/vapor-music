name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first — CI should report on the
# current state, not queue up stale runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings in CI without making local development noisy.
  RUSTFLAGS: "-D warnings"

jobs:
  # The real gate. Everything new lands in Rust, and this runs everywhere with
  # no external dependencies — no engine, no display server, no emulator.
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    defaults:
      run:
        working-directory: vapor-core

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # cpal links ALSA on Linux, and `--all-targets` builds the `play` binary,
      # so the dev headers are needed even though the library itself is
      # platform-free. This is the system dependency cpal brings with it —
      # relevant to MIG-011, which tracks validating cpal per platform.
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: vapor-core

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      # Unit *and* property tests — `proptest` cases are ordinary `cargo test`
      # targets. Release rather than debug because the fuzzing runs thousands
      # of decode attempts and a debug build makes that the slowest job here.
      - name: Test
        run: cargo test --release

  # Verifies the core stays platform-free. Only the library targets are built:
  # `vapor-engine`'s cpal dependency is deliberately gated to non-wasm targets,
  # and the CLI binaries are developer tooling that never ships to the browser.
  wasm:
    name: wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vapor-core

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: vapor-core
          key: wasm

      - name: Build vapor-dsp for wasm
        run: cargo build --release --target wasm32-unknown-unknown -p vapor-dsp --lib

      - name: Build vapor-engine for wasm
        run: cargo build --release --target wasm32-unknown-unknown -p vapor-engine --lib

      - name: Build vapor-library for wasm
        run: cargo build --release --target wasm32-unknown-unknown -p vapor-library --lib

  # Licences and security advisories, as a gate rather than a document
  # somebody re-runs by hand. docs/LICENSING.md warns that "a new dependency
  # can reintroduce copyleft silently" and then relied on a manual pass; that
  # pass drifted from 624 packages to 651 without anyone noticing (AUD-20).
  # The policy is deny.toml at the repo root, and it is the same policy for
  # both trees.
  #
  # Neither tree covers the other: `vapor-app/src-tauri` is a standalone crate
  # with its own lockfile, not a member of the `vapor-core` workspace. Both are
  # checked, and the two runs are separate steps so the log says which tree
  # failed without anyone reading a dependency graph.
  #
  # Ubuntu only. It reads lockfiles and manifests, and the answer does not
  # depend on which machine asks.
  licences:
    name: licences
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # A prebuilt binary rather than `cargo install cargo-deny --locked`,
      # which takes about a minute and a half of compile time to produce the
      # same thing.
      - uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2
        with:
          tool: cargo-deny

      # Licences and advisories both. Clean as of 2026-08-23: no copyleft
      # beyond the MPL-2.0 set docs/LICENSING.md already accounts for, no
      # vulnerability and no yanked crate in 193 packages.
      - name: vapor-core
        run: cargo deny --manifest-path vapor-core/Cargo.toml --config deny.toml check licenses advisories

      # Advisories only, for now. The shell's licence check is *not* wired up
      # because it does not pass, and it does not pass for a real reason:
      # `webpki-roots` and `webpki-root-certs` 1.0.9 arrive under
      # CDLA-Permissive-2.0, via `rustls-platform-verifier` under reqwest.
      # That is permissive and not copyleft, so it does not disturb what
      # docs/LICENSING.md concludes — but the licence is not in that
      # document's inventory, nothing there has assessed it, and adding it to
      # deny.toml here would be this session inventing the policy the gate is
      # supposed to enforce. It is exactly the silent drift AUD-20 is about,
      # caught by the gate on its first run.
      #
      # To finish: decide on CDLA-Permissive-2.0, add a row for it in
      # docs/LICENSING.md, add the identifier to deny.toml, and change this
      # step to `check licenses advisories`.
      - name: vapor-app/src-tauri
        run: cargo deny --manifest-path vapor-app/src-tauri/Cargo.toml --config deny.toml check advisories
