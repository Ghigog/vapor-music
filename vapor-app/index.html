<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vapor Music</title>
    <!--
      Fonts are bundled rather than fetched: the app must work with no network,
      which is the entire premise, and the CSP blocks remote origins anyway.
    -->
    <link rel="stylesheet" href="/fonts.css" />
    <link rel="stylesheet" href="/tokens.css" />
    <!-- The mark is a dependency-free custom element; it registers itself. -->
    <script src="/vapor-mark.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
