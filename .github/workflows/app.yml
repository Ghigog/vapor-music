name: App

# Separate from ci.yml, and path-filtered, on purpose.
#
# Building Tauri's dependency tree takes minutes. Putting these jobs in the main
# workflow would tax every commit — including ones that only touch the Godot
# tree or the docs — so the shell gets its own workflow that only runs when the
# shell or the core it depends on actually changes.
on:
  push:
    branches: [main]
    paths:
      - "vapor-app/**"
      - "vapor-core/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "vapor-app/**"
      - "vapor-core/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The frontend is cheap to check, so it runs on its own and reports fast
  # rather than waiting behind a Rust build.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vapor-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      # `npm ci` rather than `install`: the lockfile is the point of running
      # this in CI at all.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The layer that did not exist until the suite was built. Five defects
      # reached a person in one sitting and every one lived in a screen or in
      # the seam between a screen and the shell — see docs/TESTING.md.
      - name: Component tests
        run: npm test

      - name: Build
        run: npx vite build

  # Whole journeys through the real UI, plus a seeded monkey.
  #
  # Separate from the component job because it needs a browser download and a
  # dev server, and because a failure here means something different: the
  # component tests say a screen behaves, these say the app does.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vapor-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      - run: npm ci

      # Chromium only: the app ships inside a WebView, so a cross-browser
      # matrix would be testing engines it never runs in.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Journeys and monkey
        run: npm run e2e

      # Only written on failure, and the reason a monkey failure is actionable
      # rather than a rumour: the trace shows every action it took.
      - name: Upload the trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            vapor-app/playwright-report/
            vapor-app/test-results/
          retention-days: 7

  # Check, test and clippy — but not a full bundle. Bundling produces
  # installers nobody consumes on every push, and takes several times longer.
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    defaults:
      run:
        working-directory: vapor-app/src-tauri

    steps:
      - uses: actions/checkout@v4

      # Tauri's Linux backend is WebKitGTK; cpal also needs ALSA headers.
      # Neither is present on a bare runner.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vapor-app/src-tauri

      # tauri.conf.json points frontendDist at ../dist, which does not exist
      # until the frontend builds. An empty directory satisfies the config
      # without spending a full frontend build in this job — the frontend job
      # above is what actually verifies it.
      - name: Stub the frontend dist
        run: mkdir -p ../dist && touch ../dist/index.html

      # The core has been format-gated since phase 0; the shell was not, so it
      # had drifted. Gating it too means `cargo fmt` never again produces a
      # diff in files a change did not touch.
      - name: Format
        run: cargo fmt --check

      - name: Check
        run: cargo check

      # The shell has real logic worth gating on: the cache, the store, and the
      # audio path's proof that it neither allocates nor frees on the audio
      # thread (TD-03). None of it needs a window or a device, so it runs on a
      # bare runner like any other test.
      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets
