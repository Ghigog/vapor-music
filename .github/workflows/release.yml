name: Release

# Builds the installers a person actually downloads, and the `latest.json` the
# shipped updater reads. Nothing else in CI does either: `app.yml` compiles the
# shell and stops short of `tauri build`, deliberately, because bundling is slow
# and produces artefacts nobody consumes on a normal push.
#
# The updater went in before this workflow existed, which means every desktop
# binary already carries a public key and an endpoint pointing at
# `releases/latest/download/latest.json`. Until a release publishes that file
# the endpoint 404s and the app logs a line and carries on — intended, but it
# also means the updater cannot do its job until this runs once.
#
# Actions are pinned by SHA rather than tag. This is the only workflow holding
# the signing key, and a moveable tag is the supply-chain path that matters
# once a job has `contents: write` and a secret in the same environment.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

# Never cancel a release in flight. A cancelled run can leave a draft holding
# some platforms' bundles and not others, which is worse than a slow queue —
# the concurrency default elsewhere in this repo is the opposite for exactly
# the opposite reason.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cheap checks that would otherwise fail fifteen minutes into a build, or —
  # worse — after half the platforms have already uploaded.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Three files carry the version and the updater compares the one in
      # `latest.json` against the one compiled into the running app. If they
      # disagree the update either never offers itself or offers itself
      # forever, and both look like the updater is broken rather than the
      # release being wrong.
      - name: The version is the same in all three places
        run: |
          pkg=$(jq -r .version vapor-app/package.json)
          conf=$(jq -r .version vapor-app/src-tauri/tauri.conf.json)
          cargo=$(grep -m1 '^version' vapor-app/src-tauri/Cargo.toml | cut -d'"' -f2)

          echo "package.json      $pkg"
          echo "tauri.conf.json   $conf"
          echo "Cargo.toml        $cargo"

          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::the three version declarations disagree"
            exit 1
          fi

          # On a tag push the tag is the fourth declaration, and the one the
          # download URLs are built from.
          #
          # A prerelease suffix is compared away rather than required to match.
          # `docs/RELEASE.md` asks for the first tag to be an `-rc`, and the
          # three files carry a version, not a channel: v2.0.0-rc.1 is a
          # candidate *for* 2.0.0 and has to agree with it on the number and
          # differ on nothing else. Written for the first tag, which is the one
          # run that has never been exercised.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            base="${tag%%-*}"
            echo "tag               $tag (version $base)"
            if [ "$base" != "$pkg" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match version $pkg"
              exit 1
            fi
          fi

      # The public key is compiled into every binary and cannot be changed by
      # shipping an update — only by handing out a new build. One was rotated
      # on 2026-08-22 after a session printed its private half into a
      # transcript, and `tauri.conf.json` went on carrying the old public half:
      # a build signed with the live key would produce a signature the shipped
      # app refuses, which looks like a broken updater rather than a wrong key.
      #
      # Nothing depended on it while nothing shipped. The first tag is when it
      # starts to matter, so the first tag is where it is checked.
      - name: The updater public key is not the rotated one
        run: |
          rotated="dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IEYzNUVDRkI2NDBCMjk1REYKUldUZmxiSkF0czllODl3eVlTQnlkMUdFSVArbk5xNWpYbTVYd2NqdmdtVlo5dFNKYklOK0hseVIK"
          have=$(jq -r '.plugins.updater.pubkey' vapor-app/src-tauri/tauri.conf.json)
          if [ "$have" = "$rotated" ]; then
            echo "::error::tauri.conf.json still carries the public key rotated on 2026-08-22."
            echo "::error::Its private half is ~/.tauri/*.COMPROMISED-2026-08-22 and must not sign anything."
            echo "::error::Generate a fresh pair, paste the public half into plugins.updater.pubkey,"
            echo "::error::and put the private half in TAURI_SIGNING_PRIVATE_KEY. See docs/RELEASE.md 1."
            exit 1
          fi
          echo "not the rotated key"

      # `bundle.createUpdaterArtifacts` is on, so `tauri build` signs each
      # bundle and fails without the key. Finding that out here costs seconds;
      # finding it out in the build costs the whole matrix.
      #
      # Present is not the same as usable, and the difference cost a whole
      # matrix on 2026-08-24: every desktop bundle built, all three Linux
      # artefacts were written, and only then did the CLI try to sign them and
      # report "failed to decode base64 secret key: Invalid padding" — twenty
      # minutes in, for a value that was wrong before the job started.
      #
      # The key file is one long base64 line. Copying it out of a terminal
      # picks up the wrap points, the trailing `%` zsh prints for a missing
      # newline, and sometimes the shell prompt after it. All three survive a
      # non-empty check and none survives base64.
      - name: The signing key is present, and is a key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. It is the contents of"
            echo "::error::~/.tauri/vapor-music-updater.key — see docs/RELEASE.md §1."
            exit 1
          fi

          if ! printf '%s' "$KEY" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/key.txt" 2>/dev/null; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not valid base64. It is almost"
            echo "::error::certainly a copy-paste artefact — a trailing % or a shell prompt."
            echo "::error::Re-copy it with: cat ~/.tauri/vapor-music-updater.key | pbcopy"
            exit 1
          fi

          # Never the key material itself, only the shape of it.
          if ! head -1 "$RUNNER_TEMP/key.txt" | grep -q "untrusted comment:"; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY decodes, but not to a minisign key."
            echo "::error::Check the public half was not pasted into it by mistake."
            exit 1
          fi
          echo "present, decodes, and is a minisign key"

      # The Android job is forty minutes of Rust away from the step that would
      # notice a missing keystore, and it runs after the desktop matrix has
      # already uploaded into the draft. Ask here instead.
      - name: The Android keystore is present
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 and ANDROID_KEY_ALIAS are not both set."
            echo "::error::Four secrets are needed — see docs/RELEASE.md 1, 'Android'."
            exit 1
          fi
          echo "present"

  build:
    name: ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One bundle for both Apple architectures. Two separate downloads
          # would make the download page ask a question most people cannot
          # answer about their own machine.
          - name: macOS (universal)
            os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin

          # Pinned, not `ubuntu-latest`. glibc is forward-compatible only: a
          # binary built against a newer one refuses to start on an older
          # distribution, and the AppImage is supposed to be the build that
          # runs anywhere. If this label is ever retired the replacement is the
          # oldest supported ubuntu label — not `ubuntu-latest`.
          - name: Linux (x86_64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: vapor-app/src-tauri
          key: release-${{ matrix.target }}

      # Tauri's Linux backend is WebKitGTK; cpal needs ALSA; keyring and
      # souvlaki both need D-Bus. Same set as the shell job in app.yml.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev

      # `tauri.conf.json` runs `npm run build` as its beforeBuildCommand, which
      # needs node_modules to exist first.
      - name: Install frontend dependencies
        working-directory: vapor-app
        run: npm ci

      # Whitespace out, and the key handed over as a *path* rather than a
      # value. `app.yml` already does it this way and says why: the CLI reads
      # this variable as a path when the path exists and as the key itself when
      # it does not, and a private key in an environment variable is a bad
      # habit to write into a workflow. `$RUNNER_TEMP`, not `/tmp`, because
      # `/tmp` on Windows is a Git-bash fiction the CLI cannot follow.
      - name: The updater key, as a file
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$KEY" | tr -d '[:space:]' > "$RUNNER_TEMP/updater.key"
          echo "TAURI_SIGNING_PRIVATE_KEY=$RUNNER_TEMP/updater.key" >> "$GITHUB_ENV"

      # Creates or reuses one draft release per tag and uploads this platform's
      # bundles into it, plus the `.sig` beside each. `includeUpdaterJson`
      # writes `latest.json` — the file the endpoint compiled into every binary
      # actually points at.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # TAURI_SIGNING_PRIVATE_KEY is deliberately not set here — the step
          # above exported it as a file path, and a step-level env would win.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # `bundle.macOS.signingIdentity` is "Vapor Dev", a self-signed
          # certificate that exists in one login keychain and nowhere else, so
          # the bundle step on a runner fails looking for it. The CLI reads
          # this variable and it wins over the config; `-` is codesign's own
          # spelling of ad-hoc. `app.yml` has carried the same override since
          # the identity was pinned — this workflow did not, and it is the one
          # that has never run, so nothing had found that out.
          #
          # It is empty off macOS, where the CLI ignores it.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: vapor-app
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-dev', github.run_number) }}
          releaseName: Vapor Music ${{ github.ref_name }}
          releaseBody: |
            Install notes and checksums are below the asset list.

            macOS builds are not notarised yet, so the first open needs
            right-click → Open. See docs/RELEASE.md.
          # Published by the `finalise` job, once every platform has uploaded.
          # A release that goes public mid-matrix offers people a download that
          # does not exist for their machine yet.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Android, which `tauri-action` does not build — it wraps `tauri build`, and
  # the mobile bundle is a different CLI verb with a Gradle project under it.
  # So this job is hand-rolled and uploads into the same draft the matrix
  # created, which is why it waits for `build` rather than running beside it.
  #
  # A *release* APK, unlike every Android build before this one. Debug builds
  # carry unstripped Rust debuginfo — 591 MB measured 2026-08-20 — and install
  # as `...vapormusic.debug` beside a real build rather than over it. Neither is
  # something to hand to somebody else.
  #
  # arm64 only. Every phone that would run this shipped with an arm64 userspace;
  # armv7 would roughly double the Rust half of this job for devices nobody
  # testing this has, and x86_64 is emulators. Adding a target later is one word
  # in the `--target` list.
  android:
    name: Android (arm64)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vapor-app/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: vapor-app/src-tauri
          key: release-android

      # No `setup-java`: the runner image already carries Temurin, and every
      # other action in this workflow is SHA-pinned against a supply-chain path
      # that a new one would widen for no gain. AGP 8.11 needs 17 or newer and
      # the system `java` on this image is already 17 — named explicitly anyway,
      # because "whatever the image defaults to" is how a green job starts
      # failing on an image bump.
      - name: Java 17
        run: |
          test -d "$JAVA_HOME_17_X64" || { echo "::error::no JDK 17 on this image"; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$JAVA_HOME_17_X64/bin/java" -version

      # `compileSdk = 36` and AGP will not fetch a missing platform itself —
      # automatic SDK download was removed. The runner image carries some
      # platforms and which ones is not a promise, so ask for the two this
      # build names.
      - name: The SDK pieces this build names
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo "::error::no sdkmanager at $sdkmanager"; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # `ring` and the other C dependencies are built by the `cc` crate, which
      # looks for a target-prefixed compiler. The NDK ships one per API level;
      # 24 is the floor Tauri's Android template targets. Same set as the
      # `android` job in app.yml — that one proves the Rust half compiles, this
      # one has to link and package it.
      - name: Point the linker and cc at the NDK
        run: |
          TOOLCHAIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -d "$TOOLCHAIN" || { echo "::error::no NDK toolchain at $TOOLCHAIN"; exit 1; }
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          {
            echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"

      # The keystore arrives base64 because a `.jks` is binary and a GitHub
      # secret is a string. It is written under `$RUNNER_TEMP` rather than into
      # the checkout so that no step later in this job can sweep it into an
      # artefact; `keystore.properties` points at it by absolute path and is
      # already covered by `gen/android/.gitignore`.
      #
      # `gen/android/build.gradle.kts` reads that file and wires a
      # `signingConfig` only when it exists — so a fork, or this workflow
      # without the secrets, produces an unsigned build that fails honestly
      # rather than a signed one with a key nobody meant to use.
      - name: The signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vapor-upload.jks"
          test -s "$RUNNER_TEMP/vapor-upload.jks" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 did not decode to anything. See docs/RELEASE.md 1."
            exit 1
          }
          cat > vapor-app/src-tauri/gen/android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/vapor-upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "keystore written"

      # The same set the desktop matrix installs on Linux, and for a reason
      # that is not obvious on a job that targets Android: `tauri android
      # build` runs `beforeBuildCommand`, which is `npm run build`, which is
      # `npm run types:check`, which runs `cargo test export_bindings` in both
      # crates **for the host**. That host build is an ordinary Linux build —
      # cpal wants ALSA, keyring and souvlaki want D-Bus, and tauri wants
      # WebKitGTK — and none of it has anything to do with the APK.
      #
      # Without them the job dies in 81 seconds on `alsa-sys`, which reads as
      # an Android toolchain fault and is not one. Found on the first run that
      # ever reached this job, 2026-08-24.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev

      - name: Install frontend dependencies
        working-directory: vapor-app
        run: npm ci

      # `--apk` and not the AAB beside it: nobody sideloads an AAB, and this
      # release is a download rather than a store listing.
      - name: Build
        working-directory: vapor-app
        run: npm run tauri android build -- --apk --target aarch64

      # The APK's path depends on whether Tauri built one target or several, so
      # it is found rather than assumed, and renamed to something a person can
      # tell apart in a downloads folder.
      - name: Name it something a person can read
        id: apk
        run: |
          version=$(jq -r .version vapor-app/package.json)
          src=$(find vapor-app/src-tauri/gen/android/app/build/outputs/apk \
                  -name '*.apk' -path '*release*' | head -1)
          test -n "$src" || { echo "::error::no release APK was produced"; exit 1; }
          mkdir -p dist-android
          out="dist-android/vapor-music_${version}_android-arm64.apk"
          cp "$src" "$out"
          ls -lh "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"

      # The first thing in this pipeline that looks *inside* what it built.
      #
      # Everything else here proves the code compiles and that Gradle produced
      # a file. v2.0.0-rc.3 passed all of it and crashed on launch, because the
      # Rust half reaches the Java half by string — JNI symbol names and
      # `find_class` — and nothing links those at build time.
      #
      # Read `scripts/verify-apk.mjs` before trusting it: it catches a renamed
      # or removed JNI target, and it does NOT catch everything that can stop
      # an APK starting. It did not catch rc.3. It is a floor, not a gate.
      - name: The Java and native halves agree on their names
        working-directory: vapor-app
        run: node scripts/verify-apk.mjs "../${{ steps.apk.outputs.path }}"

      # The keystore is gone before anything is uploaded anywhere.
      - name: Shred the keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vapor-upload.jks"
          rm -f vapor-app/src-tauri/gen/android/keystore.properties

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vapor-music-android
          retention-days: 14
          if-no-files-found: error
          path: ${{ steps.apk.outputs.path }}

      # Into the same draft the matrix created. `--clobber` so a re-run of this
      # job replaces its own upload rather than failing on it.
      - name: Into the draft release
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${{ steps.apk.outputs.path }}" \
            --repo "${GITHUB_REPOSITORY}" --clobber

  finalise:
    name: finalise
    needs: [build, android]
    if: github.ref_type == 'tag' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # One checksums file for the whole release rather than a hash per asset
      # buried in the notes — it is what a person can actually verify against
      # with `sha256sum -c`.
      - name: Checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets && cd assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern '*' --clobber
          # latest.json is the updater's manifest, not something anyone
          # downloads by hand, and it is signed content in its own right.
          rm -f latest.json SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --repo "${GITHUB_REPOSITORY}" --clobber

      # Only now does the release become the one `releases/latest` resolves to,
      # which is the URL every shipped binary has baked in.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
          echo "published ${GITHUB_REF_NAME}"

      - name: What the updater will now answer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
          echo "endpoint: $url"
          code=$(curl -sSL -o /tmp/latest.json -w '%{http_code}' "$url" || true)
          echo "http $code"
          if [ "$code" = "200" ]; then
            jq -r '"version \(.version), platforms: \(.platforms | keys | join(", "))"' /tmp/latest.json
          else
            echo "::warning::the endpoint did not answer 200; the updater will not see this release"
          fi
